<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY STORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body onload="showProducts()">


    

    <nav class="top-navigation">

        <div class="container d-flex justify-content-between align-items-center">

            <h2 class="store-logo">MY STORE</h2>

            <div class="d-flex align-items-center gap-3">

                <a href="" class="nav-link">
                    Admin
                </a>

                <button class="btn cart-button" onclick="viewCart()">

                    <i class="bi bi-cart"></i>

                    Cart

                    <span class="badge bg-danger" id="cartcount">0</span>

                </button>

            </div>

        </div>

    </nav>



    <section class="search-hero">

        <div class="container text-center">

            <h1>What are you looking for?</h1>

            <div class="search-container">

                <select class="form-select location-select">

                    <option>All Nigeria</option>
                    <option>Lagos</option>
                    <option>Abuja</option>
                    <option>Oyo</option>
                    <option>Ogun</option>

                </select>


                <div class="input-group search-input">

                    <input
                        type="text"
                        placeholder="I am looking for..."
                        id="searchProduct"
                        class="form-control"
                    >

                    <button class="btn search-button" onclick="searchProducts()">

                        <i class="bi bi-search"></i>

                    </button>

                </div>
 
            </div>

        </div>

    </section>



    <!-- Main Marketplace Section -->

    <main class="container marketplace-container">

        <section class="col-12">

            <div class="d-flex justify-content-between align-items-center my-4">

                <h4>Avaliable Product</h4>

            </div>



            <!-- Product Display Section -->

            <div class="row g-3" id="displayProducts">

            </div>


            <!-- Product Count -->

            <div class="text-center mt-3">

                <small id="productCount" class="text-secondary"></small>

            </div>


        </section>

    </main>



    
    <div class="modal fade" id="cartModal" tabindex="-1">

        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content">


                
                <div class="modal-header">

                    <h5 class="modal-title">My Shopping Cart</h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>



                
                <div class="modal-body">

                    <div id="displayCart">

                    </div>

                </div>



               

                <div class="modal-footer">

                    <h5 class="me-auto">

                        Total: ₦<span id="cartTotal">0</span>

                    </h5>


                    <button class="btn btn-secondary" data-bs-dismiss="modal">

                        Continue Shopping

                    </button>


                    <button class="btn btn-primary" onclick="checkout()">

                        Checkout

                    </button>

                </div>


            </div>

        </div>

    </div>



    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>


</body>

</html>
