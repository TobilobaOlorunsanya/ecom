
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MY STORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TOP NAVIGATION -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm px-4 py-3">

        <div class="container-fluid">

            <h4 class="text-success mb-0">MY STORE</h4>

            <div class="ms-auto">
                <a href="index.html" class="btn btn-outline-success">
                    <i class="bi bi-shop me-1"></i>
                    View Store
                </a>
            </div>

        </div>

    </nav>


    <!-- MAIN DASHBOARD -->
    <main class="container-fluid p-4">

        <!-- DASHBOARD OVERVIEW -->
        <section id="dashboard">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>
                    <h3>Dashboard </h3>
                </div>

                <!-- COLLAPSE BUTTON -->
                <button class="btn btn-success" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#uploadForm"
                    aria-expanded="false"
                    aria-controls="uploadForm">

                    Add New Product

                </button>

            </div>

        </section>


        
        <section class="mt-4">

            <div class="collapse" id="uploadForm">

                <div class="card shadow-sm border-0 p-4">

                    <h5 class="mb-4">Upload New Product</h5>

                    <div class="mb-3">
                        <label class="form-label">Product Name</label>
                        <input type="text" id="product_name" class="form-control"
                            placeholder="Enter product name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Product Description</label>
                        <textarea id="product_description" class="form-control"
                            rows="3" placeholder="Enter product description"></textarea>
                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Product Price (₦)</label>
                            <input type="number" id="product_price" class="form-control"
                                placeholder="Enter price">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Product Quantity</label>
                            <input type="number" id="product_quantity" class="form-control"
                                placeholder="Enter quantity">
                        </div>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">Product Picture</label>
                        <input type="file" id="product_picture" class="form-control"
                            accept="image/*">
                    </div>

                    <button type="button" class="btn btn-success" onclick="addProduct()">
                        <i class="bi bi-upload me-2"></i>
                        Upload Product
                    </button>

                </div>

            </div>

        </section>

 
        <section class="mt-5">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4>All Products</h4>
                <span class="badge bg-success" id="tableProductCount">0 Products</span>
            </div>

            <div class="card shadow-sm border-0">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Picture</th>
                                <th>Product Name</th>
                                <th>Description</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Delete</th>
                                <th>Edit</th>
                            </tr>
                        </thead>

                        <tbody id="displayAdminProducts">

                        

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
